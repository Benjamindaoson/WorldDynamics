name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]' 'mujoco>=3.1' 'PyYAML>=6' 'ruff>=0.8'
      - run: python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q
